# Used by `mvn test` only: in-memory H2 database in MySQL mode, no real keys.
spring:
  datasource:
    url: jdbc:h2:mem:mrdiet;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

app:
  upload-dir: ./target/test-uploads
  jwt:
    secret: test-only-secret-test-only-secret-0123456789
  reminders:
    enabled: false
